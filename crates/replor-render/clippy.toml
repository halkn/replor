# 描画コアはファイルシステム・サブプロセス・ネットワークを直接扱わない。ファイルは
# Snapshot の trait を経由して読む（docs/design/p1-core.md の「描画コアの禁止」）。
# テストの fixture を作るコードだけは、#[cfg(test)] の中で #[allow] を付けて使ってよい。

disallowed-methods = [
  { path = "std::fs::canonicalize", reason = "read files through the Snapshot trait" },
  { path = "std::fs::copy", reason = "read files through the Snapshot trait" },
  { path = "std::fs::create_dir", reason = "read files through the Snapshot trait" },
  { path = "std::fs::create_dir_all", reason = "read files through the Snapshot trait" },
  { path = "std::fs::exists", reason = "read files through the Snapshot trait" },
  { path = "std::fs::hard_link", reason = "read files through the Snapshot trait" },
  { path = "std::fs::metadata", reason = "read files through the Snapshot trait" },
  { path = "std::fs::read", reason = "read files through the Snapshot trait" },
  { path = "std::fs::read_dir", reason = "read files through the Snapshot trait" },
  { path = "std::fs::read_link", reason = "read files through the Snapshot trait" },
  { path = "std::fs::read_to_string", reason = "read files through the Snapshot trait" },
  { path = "std::fs::remove_dir", reason = "read files through the Snapshot trait" },
  { path = "std::fs::remove_dir_all", reason = "read files through the Snapshot trait" },
  { path = "std::fs::remove_file", reason = "read files through the Snapshot trait" },
  { path = "std::fs::rename", reason = "read files through the Snapshot trait" },
  { path = "std::fs::set_permissions", reason = "read files through the Snapshot trait" },
  { path = "std::fs::soft_link", reason = "read files through the Snapshot trait" },
  { path = "std::fs::symlink_metadata", reason = "read files through the Snapshot trait" },
  { path = "std::fs::write", reason = "read files through the Snapshot trait" },
  { path = "std::os::unix::fs::symlink", reason = "read files through the Snapshot trait" },
  { path = "std::path::Path::canonicalize", reason = "read files through the Snapshot trait" },
  { path = "std::path::Path::exists", reason = "read files through the Snapshot trait" },
  { path = "std::path::Path::try_exists", reason = "read files through the Snapshot trait" },
  { path = "std::path::Path::metadata", reason = "read files through the Snapshot trait" },
  { path = "std::path::Path::symlink_metadata", reason = "read files through the Snapshot trait" },
  { path = "std::path::Path::read_dir", reason = "read files through the Snapshot trait" },
  { path = "std::path::Path::read_link", reason = "read files through the Snapshot trait" },
  { path = "std::path::Path::is_file", reason = "read files through the Snapshot trait" },
  { path = "std::path::Path::is_dir", reason = "read files through the Snapshot trait" },
  { path = "std::path::Path::is_symlink", reason = "read files through the Snapshot trait" },
  { path = "std::net::ToSocketAddrs::to_socket_addrs", reason = "the render core makes no network requests" },
]

disallowed-types = [
  { path = "std::fs::DirBuilder", reason = "read files through the Snapshot trait" },
  { path = "std::fs::DirEntry", reason = "read files through the Snapshot trait" },
  { path = "std::fs::File", reason = "read files through the Snapshot trait" },
  { path = "std::fs::FileTimes", reason = "read files through the Snapshot trait" },
  { path = "std::fs::FileType", reason = "read files through the Snapshot trait" },
  { path = "std::fs::Metadata", reason = "read files through the Snapshot trait" },
  { path = "std::fs::OpenOptions", reason = "read files through the Snapshot trait" },
  { path = "std::fs::Permissions", reason = "read files through the Snapshot trait" },
  { path = "std::fs::ReadDir", reason = "read files through the Snapshot trait" },
  { path = "std::process::Command", reason = "the render core runs no subprocess" },
  { path = "std::net::TcpListener", reason = "the render core makes no network requests" },
  { path = "std::net::TcpStream", reason = "the render core makes no network requests" },
  { path = "std::net::UdpSocket", reason = "the render core makes no network requests" },
  { path = "std::os::unix::net::UnixDatagram", reason = "the render core makes no network requests" },
